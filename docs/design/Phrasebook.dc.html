<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My phrasebook</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F5257}a:hover{color:#0A3B3F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9F9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1D2327; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800">My phrasebook</h1>
    <div style="font-size: 15px; color: #5B6670">48 saved · everything here comes back in your review</div>
    <div style="display: flex; gap: 6px">
      <div style="font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 999px; background: #0F5257; color: #FFFFFF">All</div>
      <div style="font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E7E8; color: #3B464C">Work</div>
      <div style="font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E7E8; color: #3B464C">Everyday</div>
      <div style="font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E7E8; color: #3B464C">Kiswahili</div>
    </div>
    <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <div style="background: #FFFFFF; border: 1px solid #E3E7E8; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
          <div style="font-size: 16px; font-weight: 700; line-height: 1.35">{{it.text}}</div>
          <div style="font-size: 13px; color: #5B6670">{{it.meta}}</div>
        </div>
        <button aria-label="Listen" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D5E6E6; background: #EEF5F5; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="#0F5257"></path></svg></button>
      </div>
    </sc-for>
    <button style="min-height: 48px; border-radius: 12px; border: 2px dashed #9CC3C1; background: #FFFFFF; color: #0F5257; font: inherit; font-weight: 800; font-size: 15px">Add a word or sentence</button>
  </div>
  <div style="display: flex; justify-content: space-around; background: #FFFFFF; border-top: 1px solid #E3E7E8; padding: 8px 8px 16px">
    <a href="Today.dc.html" style="min-height: 48px; min-width: 72px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none; color: #4A555C">Today</a>
    <a href="Review.dc.html" style="min-height: 48px; min-width: 72px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none; color: #4A555C">Review</a>
    <a href="Phrasebook.dc.html" style="min-height: 48px; min-width: 72px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; text-decoration: none; color: #0F5257">Phrasebook</a>
    <a href="Progress.dc.html" style="min-height: 48px; min-width: 72px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none; color: #4A555C">Progress</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { items: [
      { text: "I'll be 20 minutes late.", meta: 'Everyday · corrected in your weekly task' },
      { text: "I'll call you when I arrive.", meta: 'Everyday · corrected in your weekly task' },
      { text: 'Could we move the meeting to Thursday?', meta: 'Work · Unit 1' },
      { text: 'Where do you work?', meta: 'Everyday · question word order' },
      { text: 'Habari za asubuhi?', meta: 'Kiswahili · Good morning, how are you?' },
      { text: 'Bei gani?', meta: 'Kiswahili · How much is it?' }
    ] };
  }
}
</script>
</body>
</html>
