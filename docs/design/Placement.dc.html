<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level test</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F5257}a:hover{color:#0A3B3F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1D2327; display: flex; flex-direction: column; padding: 24px 20px; gap: 20px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Welcome.dc.html" style="font-weight: 700; font-size: 15px; text-decoration: none; min-height: 44px; display: flex; align-items: center">Back</a>
    <div style="font-size: 14px; font-weight: 700; color: #5B6670">Question 7 of 30</div>
  </div>
  <div style="height: 8px; border-radius: 4px; background: #E3E7E8; overflow: hidden"><div style="width: 23%; height: 8px; background: #0F5257"></div></div>
  <div style="display: flex; gap: 6px; flex-wrap: wrap">
    <div style="font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: #0F5257; color: #FFFFFF">Tenses</div>
    <div style="font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: #F1F3F4; color: #4A555C">Words</div>
    <div style="font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: #F1F3F4; color: #4A555C">Reading</div>
    <div style="font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: #F1F3F4; color: #4A555C">Listening</div>
    <div style="font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: #F1F3F4; color: #4A555C">Speaking</div>
    <div style="font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: #F1F3F4; color: #4A555C">Writing</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 15px; color: #5B6670">Choose the best answer</div>
    <div style="font-size: 24px; line-height: 1.35; font-weight: 800">I ____ in Nairobi since 2024.</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
      <button onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
    </sc-for>
  </div>
  <div style="font-size: 14px; line-height: 1.45; color: #5B6670">The test gets easier or harder depending on her answers. No marks are shown until the end.</div>
  <div style="flex: 1"></div>
  <a href="Results.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #0F5257; color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none">Next</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'c' }; }
  renderVals() {
    const base = 'text-align: left; min-height: 56px; padding: 14px 16px; border-radius: 14px; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; ';
    const opts = [['a', 'live'], ['b', 'am living'], ['c', 'have lived'], ['d', 'lived']];
    return {
      options: opts.map(([id, label]) => ({
        label,
        style: base + (this.state.picked === id ? 'border: 2px solid #0F5257; background: #EEF5F5; color: #0F5257' : 'border: 2px solid #E3E7E8; background: #FFFFFF; color: #1D2327'),
        pick: () => this.setState({ picked: id })
      }))
    };
  }
}
</script>
</body>
</html>
